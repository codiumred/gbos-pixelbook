# Mixer settings applied once at boot by pbmixer (audio/pbmixer.c): the headset codec and internal-microphone cards,
# which Google's dras HAL does not configure. Values are ChromeOS's (its UCM files for this board,
# avs_rt5663/HiFi.conf and avs_rt5514/HiFi.conf): the verb's EnableSequence plus each device's enable sequence.
# The headset and internal microphones are separate cards, so their switches can stay on together.
# <card id>|<control>|<value>

# RT5663 headset codec: headphone output through the stereo DAC mixer, headset microphone into ADC1
avsrt5663|Headphone Playback Volume|16
avsrt5663|STO1 ADC MIXL ADC1 Switch|on
avsrt5663|ADC Capture Volume|35
avsrt5663|DAC L Mux|STO DAC MIXL
avsrt5663|DAC R Mux|STO DAC MIXR
avsrt5663|STO1 DAC MIXL DAC L Switch|on
avsrt5663|STO1 DAC MIXR DAC R Switch|on
avsrt5663|Headphone Jack Switch|on
avsrt5663|Headset Mic Switch|on

# RT5514 digital microphones
avsrt5514|ADC1 Capture Volume|55
avsrt5514|ADC2 Capture Volume|55
avsrt5514|Sto1 ADC MIXL DMIC Switch|on
avsrt5514|Sto1 ADC MIXR DMIC Switch|on
avsrt5514|Sto2 ADC MIXL DMIC Switch|on
avsrt5514|Sto2 ADC MIXR DMIC Switch|on
